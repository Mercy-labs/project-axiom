name: Research Axiom

on:
  workflow_dispatch:
    inputs:
      question:
        description: "What should Axiom research?"
        required: true
        type: string

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q src

      - name: Run Axiom research
        env:
          PYTHONPATH: .
        run: |
          python -m src.axiom.research_cli \
            "${{ inputs.question }}"