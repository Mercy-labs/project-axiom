name: Test Axiom

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Axiom files
        run: |
          pwd
          echo "Project files:"
          find . -maxdepth 4 -type f | sort

      - name: Run Axiom
        env:
          PYTHONPATH: .
        run: |
          python -m src.axiom.axiom